# Guardrail pool and stacks for P1.
# A layer = one guardrail at one stage. Names must be unique within a stack.
# Heavy layers need the adapter modules (guardstack/layers/*_layers.py) and their models served
# by vLLM inside the job (see slurm/run_stack.sbatch). Banned-entity models (Qwen, DeepSeek, Kimi,
# GLM, Doubao, MiMo) are rejected at load time.

layers:
  # --- LlamaFirewall family
  pg2_in:      {type: promptguard2, stage: input}
  pg2_tool:    {type: promptguard2, stage: tool_output}
  align:       {type: alignment_check, stage: trace, params: {base_url: "${GUARD_URL}", model: "${GUARD_MODEL}"}}
  codeshield:  {type: codeshield, stage: output}
  regex_tool:  {type: regex, stage: tool_output}
  # --- NeMo Guardrails family (one rail per layer)
  # nemo_in judge = the job's gpt-oss-20b (GUARD_URL); nemo_out = NemoGuard 8B content safety, served
  # from the merged LoRA (slurm/merge_nemoguard.sbatch) on NEMOGUARD_URL. check_served fails fast in warmup.
  nemo_in:     {type: nemo_rails, stage: input,       params: {rail: input,  config_path: configs/nemo/self_check,
                                                               base_url: "${GUARD_URL}", models: {main: "${GUARD_MODEL}"}, check_served: true}}
  nemo_ret:    {type: nemo_rails, stage: tool_output, params: {rail: retrieval, config_path: configs/nemo/retrieval}}
  nemo_out:    {type: nemo_rails, stage: output,      params: {rail: output, config_path: configs/nemo/content_safety,
                                                               base_url: "${NEMOGUARD_URL}", check_served: true}}
  # --- PII
  presidio:    {type: presidio_pii, stage: action}
  # --- safety classifiers
  lg_in:       {type: llamaguard, stage: input,  params: {base_url: "${LLAMAGUARD_URL}", model: "${LLAMAGUARD_MODEL}"}}
  lg_out:      {type: llamaguard, stage: output, params: {base_url: "${LLAMAGUARD_URL}", model: "${LLAMAGUARD_MODEL}"}}
  pi_deberta:  {type: hf_pi_classifier, stage: tool_output, params: {model: protectai/deberta-v3-base-prompt-injection-v2}}
  # --- AgentShield-style reference layers (our implementations, not the prototype repo)
  gate:        {type: provenance_gate, stage: action}
  spot:        {type: spotlight, stage: tool_output, params: {method: datamark}}

stacks:
  # --- smoke tests (no guard LLM servers needed: in-process classifiers and rules only)
  - id: smoke_guards
    layers: [pg2_tool, regex_tool, gate, pi_deberta]
  - id: smoke_shadow
    shadow_all: true
    layers: [pg2_in, pg2_tool, regex_tool, gate, pi_deberta, presidio]

  - id: A_bare
    description: no guardrails
    layers: []

  # Every detector observes the bare agent, none acts: the layer x case verdict matrix in one run.
  # (spotlight is a transform, so it is excluded: it has no verdicts, only an enforced effect.)
  - id: shadow_all
    shadow_all: true
    layers: [pg2_in, pg2_tool, align, codeshield, regex_tool, nemo_in, nemo_ret, nemo_out, presidio,
             lg_in, lg_out, pi_deberta, gate]

  # Nested stacks from the one-pager (each adds to the previous)
  - id: B
    layers: [pg2_tool]
  - id: C
    layers: [pg2_tool, lg_out]
  - id: D
    layers: [pg2_tool, lg_out, gate]
  - id: E
    layers: [pg2_tool, lg_out, gate, spot, align]

  # Within-stage order ablation (only same-stage layers can be reordered in an agent loop)
  - id: E_toolorder_rev
    description: E with spotlight before the PromptGuard scan on tool outputs
    layers: [spot, pg2_tool, lg_out, gate, align]

# Isolated single-layer stacks (one enforced layer each) are generated by scripts/run_stack.py
# with --isolated <layer-key>, so this file does not list fourteen near-identical entries.
